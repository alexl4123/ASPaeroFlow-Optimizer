# nginx of the frontend container in docker-compose.xai.yml: serves the Angular build and passes
# /api to the clinguin backend with the prefix removed (traefik does the same in the study deployment).
server {
    listen 80;
    server_name localhost;

    # the interface JSON is requested as "api" (no trailing slash)
    location = /api {
        proxy_pass http://clinguin-backend:8000/;
        proxy_http_version 1.1;
    }

    location /api/ {
        proxy_pass http://clinguin-backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # the event stream must not be buffered
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
