# CI of the optimizer repository: both Python test suites.
# No Gurobi licence is available here. The one test that needs it
# (tests/test_time_varying_allocation_end_to_end.py) skips itself when gurobipy cannot create an environment.
name: ci

on:
  push:
    branches: [xai]
  pull_request:
    branches: [xai]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          # the benchmark scripts some tests import need psutil, which environment.yml does not list
          create-args: psutil
          cache-environment: true
      - name: Tests in tests/
        shell: micromamba-shell {0}
        run: python -m unittest discover -s tests
      - name: Tests in 01_ASPaeroFlow/xai_tests/
        shell: micromamba-shell {0}
        run: python -m unittest discover -s 01_ASPaeroFlow/xai_tests
